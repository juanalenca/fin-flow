name: Build Android APK (FinFlow)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Sincronizar Assets Web com o Capacitor Android
        run: npx cap sync android

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APKs (Release e Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Criar Chave Criptográfica Permanente e Assinar APK de Release (V2/V3/V4)
        run: |
          # 1. Gerar ou reutilizar Keystore Permanente
          if [ ! -f android/app/finflow-release.keystore ]; then
            echo "Gerando Keystore Permanente de Release..."
            keytool -genkeypair -v \
              -keystore android/app/finflow-release.keystore \
              -alias finflow-release-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass finflow_secure_pass_2026 \
              -keypass finflow_secure_pass_2026 \
              -dname "CN=FinFlow, OU=Mobile Security, O=FinFlow Org, L=Sao Paulo, ST=SP, C=BR"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/finflow-release.keystore
            git commit -m "chore(keystore): armazena chave criptografica de release permanente" || true
            git push origin main || true
          fi

          # 2. Localizar ferramentas de build do Android SDK (zipalign e apksigner)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Utilizando Android Build-Tools em: $BUILD_TOOLS_DIR"

          # 3. Alinhamento de bytes (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          # 4. Assinatura com apksigner (Esquemas V2, V3 e V4)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks android/app/finflow-release.keystore \
            --ks-pass pass:finflow_secure_pass_2026 \
            --ks-key-alias finflow-release-key \
            --key-pass pass:finflow_secure_pass_2026 \
            --out android/app/build/outputs/apk/release/FinFlow-Release-Signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          # 5. Verificação da assinatura e extração das chaves SHA-1 / SHA-256
          $BUILD_TOOLS_DIR/apksigner verify --verbose android/app/build/outputs/apk/release/FinFlow-Release-Signed.apk

          echo "### 🔑 Impressões Digitais PERMANENTES do Certificado para o Firebase Console" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/finflow-release.keystore -alias finflow-release-key -storepass finflow_secure_pass_2026 | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Disponibilizar APK de Release Assinado (Recomendado para Instalação)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Release-Signed-APK
          path: android/app/build/outputs/apk/release/FinFlow-Release-Signed.apk
          retention-days: 30

      - name: Disponibilizar APK de Debug (Opcional para Testes com Logs)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
