name: Build Android APK (FinFlow)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Sincronizar Assets Web com o Capacitor Android
        run: npx cap sync android

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APKs Assinados com Gradle (Release e Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Extrair Impressão Digital SHA-1 da Keystore Permanente
        run: |
          echo "### 🔑 Impressão Digital PERMANENTE do seu APK para o Firebase Console:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/finflow-release.keystore -alias finflow-release-key -storepass finflow_secure_pass_2026 | grep "SHA1:" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/finflow-release.keystore -alias finflow-release-key -storepass finflow_secure_pass_2026 | grep "SHA256:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Disponibilizar APK de Release Assinado (Recomendado para Instalação)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Release-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Disponibilizar APK de Debug (Opcional para Testes com Logs)
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
